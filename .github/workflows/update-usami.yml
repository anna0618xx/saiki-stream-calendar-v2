name: Update Usami stream calendar
on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_usami.py"
      - ".github/workflows/update-usami.yml"
  workflow_dispatch:
  schedule:
    # Twice daily: 05:17 and 17:17 JST (20:17 and 08:17 UTC).
    - cron: "17 8,20 * * *"
permissions:
  contents: write
concurrency:
  group: usami-stream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wiki parser
        run: python -m pip install beautifulsoup4
      - name: Collect YouTube livestreams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_usami.py
      - name: Commit updated stream data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usami-streams.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Usami stream listings"
            git push
          fi
