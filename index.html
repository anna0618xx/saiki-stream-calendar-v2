<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAC31E"><title>USAMI STREAM LOG | 宇佐美リト配信カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FAC31E;--sky:#7DDCFF;--cream:#FFF9E8;--ink:#292A2B;--border:#2A2A2A}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(135deg,#fff9e8 0,#fff9e8 24px,#fff5d7 24px,#fff5d7 25px);color:var(--ink);font-family:"DotGothic16",sans-serif}button{font:inherit;cursor:pointer}a{color:#087ba1}main{max-width:1100px;margin:auto;padding:24px 16px 60px}.hero{position:relative;background:var(--yellow);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:22px 25px;margin:0 7px 25px 0;overflow:hidden}.hero:after{content:"⚡";position:absolute;font-size:110px;right:25px;top:-15px;opacity:.18;transform:rotate(-12deg);pointer-events:none}.hero small{font-size:12px;letter-spacing:.12em}.hero h1{position:relative;font-size:clamp(24px,4.5vw,43px);margin:5px 0 8px;text-shadow:3px 3px 0 #fff}.hero p{position:relative;margin:0;font-size:13px}.panel{background:#fffefa;border:3px solid var(--ink);box-shadow:6px 6px 0 #2a2a2a;margin:0 6px 25px 0;padding:17px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.month{display:flex;gap:12px;align-items:center}.month h2{margin:0;min-width:140px;text-align:center;font-size:23px}.nav{border:2px solid var(--ink);background:var(--sky);padding:5px 13px;box-shadow:3px 3px 0 var(--ink)}.nav:focus-visible,.day:focus-visible,.stream a:focus-visible{outline:3px dashed #00688a;outline-offset:3px}.status{font-size:11px;color:#666}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;background:var(--yellow);border:1px solid var(--ink);padding:8px 0;font-size:13px}.weekday:first-child{color:#ad3a3a}.weekday:nth-child(7){color:#156d9d}.day{background:var(--cream);border:1px solid #beb8a4;text-align:left;min-width:0;min-height:113px;padding:6px;position:relative;color:var(--ink)}.day.out{opacity:.4}.day.today .num{background:var(--yellow)}.day.selected{outline:3px solid var(--ink);outline-offset:-3px;background:#e7f9ff}.day.has-stream{border-bottom:4px solid var(--yellow)}.num{display:inline-block;font-weight:bold;padding:2px 5px;font-size:12px}.mark{display:block;background:#c4f1ff;border-left:4px solid #00a2d3;font-size:11px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.mark.upcoming{background:#fff0b1;border-color:#edaa00}.day:hover{background:#ecf9ff}.details h2{margin:0 0 15px;font-size:19px}.stream{display:flex;gap:15px;align-items:center;border-top:1px dashed #bbb;padding:13px 0}.stream img{width:150px;aspect-ratio:16/9;object-fit:cover;background:#fff3c5}.stream strong{font-size:14px;overflow-wrap:anywhere}.stream small{display:block;color:#666;margin:8px 0}.stream a{display:inline-block;text-decoration:none;background:var(--sky);border:2px solid var(--ink);padding:5px 9px;font-size:12px;color:var(--ink)}.empty{padding:15px;background:var(--cream);font-size:13px}footer{font-size:11px;color:#777;margin-top:24px;line-height:1.8}@media(max-width:650px){.panel{padding:9px}.hero{padding:17px}.calendar{gap:2px}.weekday{font-size:10px;padding:6px 0}.day{min-height:74px;padding:3px}.num{font-size:11px}.mark{font-size:9px;padding:3px 2px}.month h2{min-width:112px;font-size:19px}.stream img{width:105px}.stream{gap:9px}}
</style></head><body><main><header class="hero"><small>⚡ GIRAFFE × LIGHTNING ⚡</small><h1>USAMI STREAM LOG</h1><p>宇佐美リト｜月別配信カレンダー 🌩️</p></header><section class="panel"><div class="top"><div class="month"><button class="nav" id="prev" aria-label="前月">◀</button><h2 id="month"></h2><button class="nav" id="next" aria-label="翌月">▶</button></div><span class="status" id="status">データを読み込み中…</span></div><div class="calendar" id="calendar"></div></section><section class="panel details"><h2 id="dayLabel">⚡ 配信一覧</h2><div id="details" class="empty">日付を選択してください。</div></section><footer>非公式ファン制作カレンダー。公開情報のみ掲載。配信日付は日本時間（JST）で表示します。配信予定・公開状況はYouTube側の更新により変わることがあります。<br><a href="https://www.youtube.com/@UsamiRito" target="_blank" rel="noopener noreferrer">宇佐美リト公式YouTube ↗</a></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), weekdays=['SUN','MON','TUE','WED','THU','FRI','SAT'];
let items=[],view=new Date(),selected='';
const jst=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
const dayOf=iso=>iso?jst.format(new Date(iso)).replace(/\//g,'-'):'';
const dateId=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const clean=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelTime=iso=>iso?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)):'時刻未定';
const today=dayOf(new Date().toISOString());view=new Date(Number(today.slice(0,4)),Number(today.slice(5,7))-1,1);selected=today;
function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('month').textContent=y+'.'+String(m+1).padStart(2,'0');const grid=$('calendar');grid.replaceChildren();
for(const w of weekdays){const e=document.createElement('div');e.className='weekday';e.textContent=w;grid.append(e)}
const visible=Math.ceil((first+days)/7)*7;
for(let n=0;n<visible;n++){const date=new Date(y,m,n-first+1),key=dateId(date.getFullYear(),date.getMonth()+1,date.getDate()),streams=items.filter(s=>s.dayJst===key),btn=document.createElement('button');btn.type='button';btn.className='day'+(date.getMonth()!==m?' out':'')+(key===today?' today':'')+(key===selected?' selected':'')+(streams.length?' has-stream':'');btn.setAttribute('aria-label',key+' '+streams.length+'件');const num=document.createElement('span');num.className='num';num.textContent=date.getDate();btn.append(num);for(const s of streams.slice(0,3)){const span=document.createElement('span');span.className='mark'+(s.status==='upcoming'?' upcoming':'');span.textContent=(s.status==='upcoming'?'⚡ ':'▶ ')+s.title;btn.append(span)}if(streams.length>3){const more=document.createElement('small');more.textContent='+'+(streams.length-3)+'件';btn.append(more)}btn.onclick=()=>{selected=key;render()};grid.append(btn)}
$('dayLabel').textContent='⚡ '+selected.replaceAll('-','/')+' の配信';const list=items.filter(s=>s.dayJst===selected);const detail=$('details');detail.replaceChildren();if(!list.length){detail.className='empty';detail.textContent='この日の公開配信はありません。';return}detail.className='';for(const s of list){const row=document.createElement('div');row.className='stream';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(s.videoId)+'/mqdefault.jpg';img.alt='配信サムネイル';img.loading='lazy';const body=document.createElement('div');const strong=document.createElement('strong');strong.textContent=s.title;const small=document.createElement('small');small.textContent=labelTime(s.start)+' JST'+(s.status==='upcoming'?' · 配信予定':s.status==='live'?' · 配信中':'');const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+encodeURIComponent(s.videoId);a.target='_blank';a.rel='noopener noreferrer';a.textContent='YouTubeで見る ↗';body.append(strong,small,a);row.append(img,body);detail.append(row)}}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=dateId(view.getFullYear(),view.getMonth()+1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=dateId(view.getFullYear(),view.getMonth()+1,1);render()};
(async()=>{try{const r=await fetch('./data/usami-streams.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();items=(data.streams||[]).filter(s=>/^[\w-]{11}$/.test(s.videoId)&&s.start).map(s=>({...s,dayJst:dayOf(s.start)})).sort((a,b)=>a.start.localeCompare(b.start));$('status').textContent='取得済 '+items.length+'件｜更新 '+(data.generatedAt?new Date(data.generatedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未実行')}catch(e){$('status').textContent='自動収集データは準備中です';console.warn(e)}render()})();
</script></body></html>
