<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAC31E"><title>USAMI STREAM LOG | 宇佐美リト配信カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FAC31E;--sky:#7DDCFF;--cream:#FFF9E8;--ink:#292A2B;--border:#2A2A2A}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(135deg,#fff9e8 0,#fff9e8 24px,#fff5d7 24px,#fff5d7 25px);color:var(--ink);font-family:"DotGothic16",sans-serif}button{font:inherit;cursor:pointer}a{color:#087ba1}main{max-width:1100px;margin:auto;padding:24px 16px 60px}.hero{position:relative;background:var(--yellow);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:22px 25px;margin:0 7px 25px 0;overflow:hidden}.hero:after{content:"⚡";position:absolute;font-size:110px;right:25px;top:-15px;opacity:.18;transform:rotate(-12deg);pointer-events:none}.hero small{font-size:12px;letter-spacing:.12em}.hero h1{position:relative;font-size:clamp(24px,4.5vw,43px);margin:5px 0 8px;text-shadow:3px 3px 0 #fff}.hero p{position:relative;margin:0;font-size:13px}.panel{background:#fffefa;border:3px solid var(--ink);box-shadow:6px 6px 0 #2a2a2a;margin:0 6px 25px 0;padding:17px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.month{display:flex;gap:12px;align-items:center}.month h2{margin:0;min-width:140px;text-align:center;font-size:23px}.nav{border:2px solid var(--ink);background:var(--sky);padding:5px 13px;box-shadow:3px 3px 0 var(--ink)}.nav:focus-visible,.day:focus-visible,.stream a:focus-visible{outline:3px dashed #00688a;outline-offset:3px}.status{font-size:11px;color:#666}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;background:var(--yellow);border:1px solid var(--ink);padding:8px 0;font-size:13px}.weekday:first-child{color:#ad3a3a}.weekday:nth-child(7){color:#156d9d}.day{background:var(--cream);border:1px solid #beb8a4;text-align:left;min-width:0;min-height:113px;padding:6px;position:relative;color:var(--ink)}.day.out{opacity:.4}.day.today .num{background:var(--yellow)}.day.selected{outline:3px solid var(--ink);outline-offset:-3px;background:#e7f9ff}.day.has-stream{border-bottom:4px solid var(--yellow)}.num{display:inline-block;font-weight:bold;padding:2px 5px;font-size:12px}.mark{display:block;background:#c4f1ff;border-left:4px solid #00a2d3;font-size:11px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.mark.upcoming{background:#fff0b1;border-color:#edaa00}.day:hover{background:#ecf9ff}.details h2{margin:0 0 15px;font-size:19px}.stream{display:flex;gap:15px;align-items:center;border-top:1px dashed #bbb;padding:13px 0}.stream img{width:150px;aspect-ratio:16/9;object-fit:cover;background:#fff3c5}.stream strong{font-size:14px;overflow-wrap:anywhere}.stream small{display:block;color:#666;margin:8px 0}.stream a{display:inline-block;text-decoration:none;background:var(--sky);border:2px solid var(--ink);padding:5px 9px;font-size:12px;color:var(--ink)}.empty{padding:15px;background:var(--cream);font-size:13px}footer{font-size:11px;color:#777;margin-top:24px;line-height:1.8}@media(max-width:650px){.panel{padding:9px}.hero{padding:17px}.calendar{gap:2px}.weekday{font-size:10px;padding:6px 0}.day{min-height:74px;padding:3px}.num{font-size:11px}.mark{font-size:9px;padding:3px 2px}.month h2{min-width:112px;font-size:19px}.stream img{width:105px}.stream{gap:9px}}

/* Usami v2.1: soft brown + electric cyan */
:root{--sky:#28e4ec;--cream:#fff7e3;--ink:#51382b;--border:#8b6751}
body{background:#fff7e8;color:var(--ink)}
.hero{background:linear-gradient(115deg,#ffd75c,#fac31e 65%,#f3a52c);border:2px solid #9c7553;box-shadow:0 5px 15px #78533222;border-radius:17px;padding:27px}
.hero:after{opacity:.14}.hero h1{text-shadow:1px 2px 0 #fff7d4}
.hero .catchphrase{font-size:clamp(11px,1.7vw,15px);font-weight:bold;letter-spacing:.04em}
.birthday{position:relative;display:inline-block;margin-top:15px;padding:5px 13px;background:#fff4d2cc;border:1px solid #d9a341;border-radius:12px;font-size:13px;font-weight:bold}
.panel{border:1px solid #e4cdae;box-shadow:0 4px 15px #7a56301a;border-radius:17px;background:#fffdf7}
.nav{background:#fff1bd;border:1px solid #c6a376;box-shadow:0 2px 5px #6f4a2526;border-radius:10px;color:var(--ink);font-weight:bold;padding:8px 13px}
.nav:hover{background:var(--sky);border-color:#25a9af}
.nav.add{background:var(--yellow)}.tools{display:flex;gap:8px;flex-wrap:wrap}.top{row-gap:15px}
.weekday{border:0;background:#fff0bd;border-radius:7px;color:#634735}
.day{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;overflow:hidden;isolation:isolate;min-height:135px;background:#fff9ed;border:1px solid #efdfc8;border-radius:8px;padding:6px;transition:border-color .15s,box-shadow .15s}
.day.out{opacity:.48}.day.has-stream{border-bottom:0;color:white;background:#755b46}
.day.has-stream:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#21160f90,#21160f00 40%,#1f130ed4);z-index:-1}
.day .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.day .num{flex-shrink:0;align-self:flex-start;margin:0;background:#fff5dcf2;color:#543e2e;border-radius:6px;box-shadow:0 1px 5px #38261940;z-index:1}
.day .mark{position:relative;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow:hidden;margin-top:auto;padding:3px 5px;background:#432b23b5;border:0;border-radius:5px;color:white;text-shadow:0 1px 3px #24130f;font-size:10px;line-height:1.4;max-width:100%}
.day .more{position:absolute;top:5px;right:4px;padding:3px;background:#28e4ec;color:#51382b;border-radius:5px;font-weight:bold;font-size:10px}
.day.today{border:3px solid var(--sky);box-shadow:inset 0 0 0 2px #ffffffa8;padding:4px}
.day.today .num{background:var(--sky)}.day.selected{outline:2px solid #ac7951;outline-offset:-3px}
.day:hover{border-color:#1dced9;filter:brightness(1.03)}.day:not(.has-stream):hover{background:#fff6df}
.stream a{border:1px solid #43bbc2;border-radius:9px;background:var(--sky);color:#4f392c}
dialog{border:2px solid #bd9064;border-radius:18px;background:#fff9ee;color:var(--ink);width:min(480px,94vw);box-shadow:0 15px 60px #50352455}
dialog::backdrop{background:#30201690}dialog form{display:grid;gap:12px}dialog h2{margin:0 0 6px}
dialog label{display:grid;gap:5px;font-size:13px;font-weight:bold}dialog input{width:100%;min-width:0;border:1px solid #d6bc92;border-radius:9px;padding:10px;font:inherit;background:#fff}
.formActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.hint{font-size:11px;color:#755d4b;margin:0}.delete{color:#a13d39}.editStream{margin-left:8px;border:0;background:transparent;color:#795038;text-decoration:underline}
@media(max-width:650px){.hero{padding:20px}.day{min-height:92px;padding:3px}.day.today{padding:1px}.day .mark{font-size:9px;-webkit-line-clamp:2;padding:2px;margin-top:auto}.day .more{font-size:8px;padding:1px 2px;top:4px;right:2px}.day .num{font-size:10px;padding:2px 4px}.tools{width:100%}.nav{padding:7px 10px}}

/* Hood-inspired geometric header and quieter toolbar */
.hero{background:linear-gradient(115deg,#ffde70 0%,#fac31e 54%,#ff9d24 100%);isolation:isolate;min-height:152px}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.72;pointer-events:none;background:
linear-gradient(145deg,transparent 48%,#f59b21 48% 60%,transparent 60%) 5% 3%/160px 125px,
linear-gradient(35deg,transparent 43%,#fbd34f 43% 59%,transparent 59%) 20px 20px/205px 135px,
linear-gradient(150deg,transparent 47%,#ed8e24 47% 61%,transparent 61%) 65px 6px/260px 150px,
linear-gradient(42deg,transparent 39%,#ffe18a 39% 52%,transparent 52%) 0 0/150px 120px}
.hero::after{content:"";right:-25px;top:-30px;width:45%;height:160%;opacity:.35;transform:rotate(-14deg);background:linear-gradient(130deg,transparent 15%,#ef8f20 15% 30%,transparent 30% 42%,#ffe796 42% 53%,transparent 53%)}
.hero h1,.hero .catchphrase{position:relative;z-index:1}
.top{display:grid;grid-template-columns:1fr auto;align-items:center}
.tools{justify-self:end;justify-content:flex-end}
.feedStatus{font-size:10px;color:#907e6e;text-align:right;margin-top:11px;line-height:1.4}
@media(max-width:650px){.top{grid-template-columns:1fr;gap:10px}.tools{width:auto;justify-self:end;justify-content:flex-end}.hero::before{background-size:130px 115px,160px 100px,190px 110px,125px 90px}}
</style></head><body><main><header class="hero"><h1>宇佐美リト</h1><p class="catchphrase">U・S・A・M・I！宇佐美～！！</p></header><section class="panel"><div class="top"><div class="month"><button class="nav" id="prev" aria-label="前月">◀</button><h2 id="month"></h2><button class="nav" id="next" aria-label="翌月">▶</button></div><div class="tools"><button class="nav" id="todayBtn">今日</button><button class="nav add" id="addStream">＋ 配信を手動追加</button></div></div><div class="calendar" id="calendar"></div><div class="feedStatus" id="status">データを読み込み中…</div></section><section class="panel details"><h2 id="dayLabel">⚡ 配信一覧</h2><div id="details" class="empty">日付を選択してください。</div></section><dialog id="entryDialog"><form id="entryForm"><h2 id="entryHeading">配信を手動追加</h2><label>配信日・開始時刻（日本時間）<input type="datetime-local" id="entryDate" required></label><label>配信タイトル<input type="text" id="entryTitle" maxlength="200" required></label><label>YouTube URL（他サイトのURLも可）<input type="url" id="entryURL" placeholder="https://www.youtube.com/watch?v=..." required></label><div class="formActions"><button type="button" class="nav" id="cancelEntry">キャンセル</button><button type="button" class="nav delete" id="deleteEntry" hidden>削除</button><button type="submit" class="nav add">保存</button></div><p class="hint">手動追加した配信は、このブラウザ内に保存されます。別の端末には同期されません。</p></form></dialog><footer>非公式ファン制作カレンダー。公開情報のみ掲載。配信日付は日本時間（JST）で表示します。配信予定・公開状況はYouTube側の更新により変わることがあります。<br><a href="https://www.youtube.com/@UsamiRito" target="_blank" rel="noopener noreferrer">宇佐美リト公式YouTube ↗</a></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), weekdays=['SUN','MON','TUE','WED','THU','FRI','SAT'];
let items=[],view=new Date(),selected='';
const jst=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
const dayOf=iso=>{if(!iso)return '';const p=Object.fromEntries(jst.formatToParts(new Date(iso)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};
const dateId=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const clean=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelTime=iso=>iso?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)):'時刻未定';
const today=dayOf(new Date().toISOString());view=new Date(Number(today.slice(0,4)),Number(today.slice(5,7))-1,1);selected=today;
function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('month').textContent=y+'.'+String(m+1).padStart(2,'0');const grid=$('calendar');grid.replaceChildren();
for(const w of weekdays){const e=document.createElement('div');e.className='weekday';e.textContent=w;grid.append(e)}
const visible=Math.ceil((first+days)/7)*7;
for(let n=0;n<visible;n++){const date=new Date(y,m,n-first+1),key=dateId(date.getFullYear(),date.getMonth()+1,date.getDate()),streams=items.filter(s=>s.dayJst===key),btn=document.createElement('button');btn.type='button';btn.className='day'+(date.getMonth()!==m?' out':'')+(key===today?' today':'')+(key===selected?' selected':'')+(streams.length?' has-stream':'');btn.setAttribute('aria-label',key+' '+streams.length+'件');if(streams.length){const s=streams.find(x=>x.videoId)||streams[0];if(s.videoId){const image=document.createElement('img');image.className='cover';image.src='https://i.ytimg.com/vi/'+encodeURIComponent(s.videoId)+'/hqdefault.jpg';image.loading='lazy';image.alt='';btn.append(image)}}const num=document.createElement('span');num.className='num';num.textContent=date.getDate();btn.append(num);if(streams.length){const span=document.createElement('span');span.className='mark';span.textContent=(streams[0].status==='upcoming'?'⚡ ':'▶ ')+streams[0].title;btn.append(span);if(streams.length>1){const more=document.createElement('span');more.className='more';more.textContent='+'+(streams.length-1);btn.append(more)}}btn.onclick=()=>{selected=key;render()};grid.append(btn)}
$('dayLabel').textContent='⚡ '+selected.replaceAll('-','/')+' の配信';const list=items.filter(s=>s.dayJst===selected);const detail=$('details');detail.replaceChildren();if(!list.length){detail.className='empty';detail.textContent='この日の公開配信はありません。';return}detail.className='';for(const s of list){const row=document.createElement('div');row.className='stream';const img=document.createElement('img');img.src=s.videoId?'https://i.ytimg.com/vi/'+encodeURIComponent(s.videoId)+'/mqdefault.jpg':'';if(!s.videoId)img.hidden=true;img.alt='配信サムネイル';img.loading='lazy';const body=document.createElement('div');const strong=document.createElement('strong');strong.textContent=s.title;const small=document.createElement('small');small.textContent=labelTime(s.start)+' JST'+(s.status==='upcoming'?' · 配信予定':s.status==='live'?' · 配信中':'');const a=document.createElement('a');a.href=s.url||('https://www.youtube.com/watch?v='+encodeURIComponent(s.videoId));a.target='_blank';a.rel='noopener noreferrer';a.textContent='YouTubeで見る ↗';body.append(strong,small,a);if(s.manual){const edit=document.createElement('button');edit.className='editStream';edit.textContent='編集';edit.onclick=()=>openEntry(s);body.append(edit)}row.append(img,body);detail.append(row)}}
const STORAGE='usami-manual-streams-v1';let manual=[];try{manual=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(!Array.isArray(manual))manual=[]}catch{manual=[]}
let remote=[];let editing=null;
function mergeRecords(){items=[...remote,...manual.map(x=>({...x,dayJst:x.localDate.slice(0,10)}))].sort((a,b)=>String(a.start).localeCompare(String(b.start)))}
function openEntry(item){editing=item||null;$('entryHeading').textContent=item?'配信を編集':'配信を手動追加';$('entryDate').value=item?.localDate||selected+'T20:00';$('entryTitle').value=item?.title||'';$('entryURL').value=item?.url||'';$('deleteEntry').hidden=!item;$('entryDialog').showModal()}
function saveManual(){localStorage.setItem(STORAGE,JSON.stringify(manual));mergeRecords();render()}
$('addStream').onclick=()=>openEntry(null);$('cancelEntry').onclick=()=>$('entryDialog').close();
$('todayBtn').onclick=()=>{view=new Date(Number(today.slice(0,4)),Number(today.slice(5,7))-1,1);selected=today;render()};
$('entryForm').onsubmit=e=>{e.preventDefault();const localDate=$('entryDate').value,title=$('entryTitle').value.trim(),url=$('entryURL').value.trim();if(!localDate||!title||!url)return;let parsed;try{parsed=new URL(url);if(!['https:','http:'].includes(parsed.protocol))throw Error()}catch{return alert('http(s)のURLを指定してください')};const vid=(parsed.hostname.endsWith('youtube.com')?parsed.searchParams.get('v')||parsed.pathname.split('/').pop():parsed.hostname==='youtu.be'?parsed.pathname.slice(1):'')||'';const videoId=/^[\w-]{11}$/.test(vid)?vid:'';const entry={id:editing?.id||String(Date.now())+'-'+Math.random().toString(36).slice(2),manual:true,title,url,videoId,localDate,start:new Date(localDate+'+09:00').toISOString(),status:'ended'};manual=editing?manual.map(x=>x.id===editing.id?entry:x):[...manual,entry];$('entryDialog').close();saveManual()};
$('deleteEntry').onclick=()=>{if(editing&&confirm('この手動登録を削除しますか？')){manual=manual.filter(x=>x.id!==editing.id);$('entryDialog').close();saveManual()}};

$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=dateId(view.getFullYear(),view.getMonth()+1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=dateId(view.getFullYear(),view.getMonth()+1,1);render()};
(async()=>{try{const r=await fetch('./data/usami-streams.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();remote=(data.streams||[]).filter(s=>/^[\w-]{11}$/.test(s.videoId)&&s.start).map(s=>({...s,dayJst:dayOf(s.start)})).sort((a,b)=>a.start.localeCompare(b.start));$('status').textContent='自動取得 '+remote.length+'件｜更新 '+(data.generatedAt?new Date(data.generatedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未実行')}catch(e){$('status').textContent='自動収集データは準備中です';console.warn(e)}mergeRecords();render()})();
</script></body></html>
